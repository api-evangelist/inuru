name: INURU
description: >-
  INURU (Inuru GmbH) is a Berlin-based printed-electronics company that
  manufactures ultra-thin, flexible printed OLED lighting for smart packaging,
  labels, apparel, and medical products. Its core product, the Elf (Embeddable
  Luminous Film), combines an inkjet-printed OLED, a power source, and a
  microchip into a paper-thin, waterproof film that can glow in any shape and
  respond to touch, motion, or sound. Founded in 2016, Inuru operates the
  automated "Dragon Factory" OLED production line in Wildau and works with
  brands such as Coca-Cola and Marvel on interactive, sustainable
  smart-packaging and medication-adherence labels. This is a company/provider
  record in the API Evangelist network; Inuru is a hardware and smart-packaging
  manufacturer and does not currently publish a public developer API.
